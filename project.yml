name: NoctDesktop
options:
  bundleIdPrefix: org.noctdesktop
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  NoctDesktop:
    type: application
    platform: macOS
    sources:
      - path: src/NoctDesktop.swift
      - path: src/DesktopViews.swift
      - path: src/VMDisplay.swift
      - path: src/NoctMetal.swift
      - path: src/NativeWorkspace.swift
      - path: src/NativeImageInstaller.swift
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Noct Desktop
        PRODUCT_BUNDLE_IDENTIFIER: org.noctdesktop.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Noct Desktop
        INFOPLIST_KEY_NoctVMRuntime: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: AppKit.framework
      - sdk: MetalKit.framework
      - sdk: CryptoKit.framework
      - target: NoctGPUBroker
        embed: false
    postBuildScripts:
      - name: Bundle guest runtime and Metal helper
        script: '"$SRCROOT/tools/bundle-native.sh"'
        basedOnDependencyAnalysis: false
  NoctRuntime:
    type: tool
    platform: macOS
    sources:
      - path: src/NoctRuntimeCLI.swift
      - path: src/NativeWorkspace.swift
      - path: src/NativeImageInstaller.swift
    dependencies:
      - sdk: CryptoKit.framework
  NoctGPUBroker:
    type: tool
    platform: macOS
    sources:
      - path: src/NoctGPUBroker.swift
      - path: src/NoctMetal.swift
    dependencies:
      - sdk: MetalKit.framework
  NoctRuntimeChecks:
    type: tool
    platform: macOS
    sources:
      - path: tools/VerifyNativeRuntime.swift
      - path: src/NativeWorkspace.swift
      - path: src/NativeImageInstaller.swift
    dependencies:
      - sdk: CryptoKit.framework
schemes:
  NoctDesktop:
    build:
      targets:
        NoctDesktop: all
        NoctRuntime: all
    run:
      config: Debug
      environmentVariables:
        NOCT_DEVELOPMENT_ROOT: $(SRCROOT)
    archive:
      config: Release
